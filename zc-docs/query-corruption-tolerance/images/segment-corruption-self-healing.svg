<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1420" viewBox="0 0 1800 1420" role="img" aria-labelledby="title description">
  <title id="title">segment 文件损坏识别与自愈</title>
  <desc id="description">拟实现方案。BE 捕获物理损坏证据，设置 SUSPECT 并立即隔离复制源；后台核实实例、文件归属并复读，确认后持久化为 CORRUPT，通过 tablet report 上报 FE。具备恢复条件后复用 BAD 和 clone 修复机制，经版本与文件完整性验收后恢复。CORRUPT 副本排除 compaction 候选，并在选取和执行前检查；进一步优化为 rowset 级隔离，仅合并合法、健康的连续版本区间。标记独立于查询容错和 FE BAD，本身不删除数据。</desc>
  <defs>
    <style>
      text { font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #172b3a; }
      .title { font-size: 44px; font-weight: 600; }
      .section { font-size: 29px; font-weight: 600; }
      .heading { font-size: 25px; font-weight: 600; }
      .node-title { font-size: 23px; font-weight: 600; }
      .body { font-size: 22px; fill: #344b59; }
      .small { font-size: 19px; fill: #526575; }
      .label { font-size: 18px; fill: #526575; }
      .blue { fill: #25648a; }
      .yellow { fill: #8a610b; }
      .red { fill: #a52c25; }
      .green { fill: #16634e; }
      .flow { fill: none; stroke: #66869b; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; marker-end: url(#arrow); }
      .branch { fill: none; stroke: #9ba9b2; stroke-width: 2; stroke-linejoin: round; marker-end: url(#branch-arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#66869b"/>
    </marker>
    <marker id="branch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#9ba9b2"/>
    </marker>
  </defs>

  <rect width="1800" height="1420" fill="#ffffff"/>
  <text x="48" y="74" class="title">segment 文件损坏识别与自愈</text>
  <text x="48" y="119" class="body">发现损坏 · 隔离复制源 · 受控修复 · 恢复调度</text>
  <rect x="1500" y="41" width="252" height="46" rx="23" fill="#edf1f5"/>
  <text x="1626" y="72" text-anchor="middle" font-size="21" font-weight="600" fill="#526575">方案设计 · 拟实现</text>

  <!-- Main flow: BE detection, then FE-coordinated repair. -->
  <rect x="48" y="154" width="1150" height="716" rx="22" fill="#f5f7f9"/>
  <rect x="1230" y="154" width="522" height="716" rx="22" fill="#f0f6fa"/>
  <text x="76" y="201" class="section">BE 损坏识别</text>
  <text x="1262" y="201" class="section blue">FE 协调修复</text>

  <rect x="76" y="235" width="236" height="174" rx="14" fill="#ffffff" stroke="#d4e0e8" stroke-width="1.5"/>
  <text x="96" y="274" class="node-title">发现物理损坏</text>
  <text x="96" y="311" class="small">TabletReader、</text>
  <text x="96" y="339" class="small">compaction 创建等入口</text>
  <text x="96" y="382" font-size="17" fill="#526575">checksum / magic / footer</text>

  <path d="M 313 321 H 348" class="flow"/>
  <rect x="350" y="235" width="236" height="174" rx="14" fill="#fff5d9" stroke="#e5c77c" stroke-width="1.5"/>
  <text x="370" y="274" font-size="26" font-weight="600" class="yellow">SUSPECT</text>
  <text x="370" y="313" class="node-title yellow">疑似损坏</text>
  <text x="370" y="352" class="small">记录 tablet 实例、</text>
  <text x="370" y="380" class="small">文件及错误证据</text>

  <path d="M 587 321 H 622" class="flow"/>
  <rect x="624" y="235" width="236" height="174" rx="14" fill="#eaf3fa" stroke="#bdd4e5" stroke-width="1.5"/>
  <text x="644" y="274" class="node-title blue">后台核实与复读</text>
  <text x="644" y="322" class="small">核对实例与文件归属</text>
  <text x="644" y="360" class="small">复读确认物理损坏</text>

  <text x="881" y="300" text-anchor="middle" font-size="17" fill="#526575">确认</text>
  <path d="M 861 321 H 898" class="flow"/>
  <rect x="900" y="235" width="254" height="174" rx="14" fill="#fbe7e0" stroke="#e0b5a8" stroke-width="1.5"/>
  <text x="920" y="274" font-size="26" font-weight="600" class="red">CORRUPT</text>
  <text x="920" y="313" class="node-title red">确认损坏</text>
  <text x="920" y="365" class="body">持久化损坏状态</text>

  <!-- Non-confirmed evidence is handled without entering repair. -->
  <path d="M 742 409 V 440 H 562 V 466" class="branch"/>
  <path d="M 742 440 H 978 V 466" class="branch"/>
  <rect x="350" y="468" width="424" height="113" rx="14" fill="#fffaf0" stroke="#eadcb6"/>
  <text x="376" y="510" class="node-title yellow">证据不足</text>
  <text x="376" y="548" class="body">保持疑似隔离，继续核实</text>
  <rect x="802" y="468" width="352" height="113" rx="14" fill="#ffffff" stroke="#d5dde2"/>
  <text x="826" y="510" class="node-title">误判／原证据失效</text>
  <text x="826" y="548" class="body">清除对应疑似状态</text>

  <!-- The report only carries the state; repair still requires eligibility. -->
  <text x="1212" y="296" text-anchor="middle" font-size="18" font-weight="600" class="blue">上报 FE</text>
  <path d="M 1155 321 H 1266" class="flow"/>
  <text x="1212" y="348" text-anchor="middle" font-size="17" fill="#526575">tablet report</text>
  <rect x="1268" y="235" width="446" height="174" rx="14" fill="#ffffff" stroke="#bdd4e5" stroke-width="1.5"/>
  <text x="1296" y="279" class="heading blue">具备恢复条件</text>
  <text x="1296" y="320" class="heading blue">触发副本修复</text>
  <text x="1296" y="372" class="body">复用现有 BAD 与 clone 修复机制</text>

  <path d="M 1491 410 V 466" class="flow"/>
  <rect x="1268" y="468" width="446" height="128" rx="14" fill="#ffffff" stroke="#bdd4e5" stroke-width="1.5"/>
  <text x="1296" y="512" class="heading blue">修复结果验收</text>
  <text x="1296" y="555" class="body">核对版本覆盖与文件完整性</text>

  <path d="M 1491 597 V 662" class="flow"/>
  <rect x="1438" y="612" width="106" height="30" rx="15" fill="#f0f6fa"/>
  <text x="1491" y="634" text-anchor="middle" font-size="19" class="green">验收通过</text>
  <rect x="1268" y="664" width="446" height="151" rx="14" fill="#e6f3ec" stroke="#aacdbb" stroke-width="1.5"/>
  <text x="1296" y="706" class="heading green">解除隔离，恢复正常</text>
  <text x="1296" y="747" class="body">清除对应实例损坏状态</text>
  <text x="1296" y="784" class="body">恢复复制源资格与 compaction 调度</text>
  <text x="1491" y="849" text-anchor="middle" class="small">未通过验收，不解除隔离</text>

  <!-- Isolation is immediate for SUSPECT and remains in effect for CORRUPT. -->
  <rect x="76" y="625" width="1078" height="215" rx="16" fill="#fff3ec" stroke="#ead2c3"/>
  <rect x="76" y="645" width="6" height="53" rx="3" fill="#b94b33"/>
  <text x="102" y="671" font-size="29" font-weight="600" class="red">从 SUSPECT 开始，禁止作为复制源</text>
  <text x="102" y="718" class="body">BE 快照入口同步检查，拒绝 SUSPECT / CORRUPT 副本提供修复数据</text>
  <text x="102" y="759" class="body">FE 感知损坏状态后，排除对应复制源</text>
  <text x="102" y="809" font-size="23" font-weight="600" class="red">不等待 FE 标记 BAD 才开始隔离</text>

  <!-- Scheduling protections are separate from the repair sequence. -->
  <text x="48" y="931" class="section">compaction 调度</text>
  <rect x="48" y="958" width="1014" height="324" rx="20" fill="#f0f6fa"/>
  <text x="80" y="1005" class="heading blue">CORRUPT 副本：调度排除</text>

  <rect x="80" y="1037" width="282" height="131" rx="14" fill="#ffffff" stroke="#c6dae8"/>
  <text x="104" y="1078" class="body">① 候选生成</text>
  <text x="104" y="1130" class="heading blue">不再加入候选</text>
  <path d="M 364 1102 H 412" class="flow"/>
  <rect x="414" y="1037" width="282" height="131" rx="14" fill="#ffffff" stroke="#c6dae8"/>
  <text x="438" y="1078" class="body">② 候选选取</text>
  <text x="438" y="1130" class="heading blue">移除已有候选</text>
  <path d="M 698 1102 H 746" class="flow"/>
  <rect x="748" y="1037" width="282" height="131" rx="14" fill="#ffffff" stroke="#c6dae8"/>
  <text x="772" y="1078" class="body">③ 执行前</text>
  <text x="772" y="1130" class="heading blue">再次检查状态</text>
  <text x="80" y="1222" class="body">不主动停止全部在途任务；正常 tablet 继续调度</text>

  <!-- Optional scheduling refinement, not an unconditional repair-success step. -->
  <rect x="1094" y="958" width="658" height="324" rx="20" fill="#ffffff" stroke="#91aebf" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="1126" y="1005" class="heading blue">进一步优化调度：rowset 级隔离</text>
  <text x="1126" y="1045" class="body">仅合并合法、健康的连续版本区间</text>

  <rect x="1126" y="1070" width="186" height="111" rx="12" fill="#eff7f3"/>
  <text x="1219" y="1109" text-anchor="middle" font-size="21" class="green">健康连续区间</text>
  <text x="1219" y="1155" text-anchor="middle" font-size="23" font-weight="600" class="green">区间内合并</text>
  <rect x="1330" y="1070" width="186" height="111" rx="12" fill="#fbe7e0"/>
  <text x="1423" y="1109" text-anchor="middle" font-size="21" class="red">损坏范围</text>
  <text x="1423" y="1155" text-anchor="middle" font-size="23" font-weight="600" class="red">保留，不跨越</text>
  <rect x="1534" y="1070" width="186" height="111" rx="12" fill="#eff7f3"/>
  <text x="1627" y="1109" text-anchor="middle" font-size="21" class="green">健康连续区间</text>
  <text x="1627" y="1155" text-anchor="middle" font-size="23" font-weight="600" class="green">区间内合并</text>
  <text x="1126" y="1230" class="body">不跨越损坏范围提交不完整结果</text>

  <rect x="48" y="1314" width="1704" height="68" rx="14" fill="#edf1f5"/>
  <text x="80" y="1357" font-size="23" font-weight="600">SUSPECT / CORRUPT 独立于查询容错开关和 FE BAD；标记本身不直接删除数据。</text>
</svg>
