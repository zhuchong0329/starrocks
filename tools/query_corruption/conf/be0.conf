# Dedicated QCT test BE 0. Never use these paths/ports for Tenant-TTL.
LOG_DIR = ${STARROCKS_HOME}/log
PID_DIR = ${STARROCKS_HOME}/bin
UDF_RUNTIME_DIR = ${STARROCKS_HOME}/udf
storage_root_path = ${STARROCKS_HOME}/storage
sys_log_level = INFO
priority_networks = 127.0.0.0/8
be_http_port = 19400
be_port = 19401
heartbeat_service_port = 19402
brpc_port = 19403
mem_limit = 2G
brpc_num_threads = 4
be_service_threads = 8
pipeline_exec_thread_pool_thread_num = 2
pipeline_scan_thread_pool_thread_num = 2
pipeline_prepare_thread_pool_thread_num = 2
max_compaction_concurrency = 0
disable_storage_page_cache = true
