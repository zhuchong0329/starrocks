# Dedicated QCT test cluster only. Not the product default configuration.
JAVA_OPTS = "-Xms512m -Xmx2g -XX:+UseG1GC -Dlog4j2.formatMsgNoLookups=true"
LOG_DIR = ${STARROCKS_HOME}/log
PID_DIR = ${STARROCKS_HOME}/bin
meta_dir = ${STARROCKS_HOME}/meta
sys_log_level = INFO
priority_networks = 127.0.0.0/8
http_port = 19300
edit_log_port = 19301
rpc_port = 19302
query_port = 19303
enable_statistic_collect = false
# Freeze placement across A/B/C restarts; this is a test-only environment setting.
tablet_sched_disable_balance = true
enable_query_corruption_tolerance = false
